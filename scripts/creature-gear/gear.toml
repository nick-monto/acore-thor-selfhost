# Rules for scripts/creature-gear/gen_creature_gear.py.
# These are generation-time policies: change a value, re-run the generator, commit
# the regenerated SQL under modules/mod-creature-gear/data/sql/world/base.

# Lowest creature_template.minlevel a creature may have to be considered.
min_level = 1

# Highest creature_template.maxlevel a creature may have to be considered.
max_level = 80

# Skip creatures with a non-zero npcflag (quest givers, vendors, trainers, ...).
skip_nonzero_npcflag = true

# Creature entries that must never be touched, whatever the other rules say.
exclude_entries = []

# Upper bound on how many creatures end up in the generated SQL, ascending entry order.
# 0 means no bound: every creature the rules above admit. The shipped dataset is uncapped
# (1274 creatures under the pinned base dumps); set a number to generate a smaller slice.
max_creatures = 0

# Variants per creature in creature_equip_template. The core resolves
# creature.equipment_id = -1 by picking one of the IDs 1..n, so the IDs must stay
# contiguous; roles cycle 0 = two-hander, 1 = one-hander + shield/holdable, 2 = ranged.
pool_size = 3

# Variants per creature for the five armour slots that vary per spawn point: HEAD, CHEST, LEGS,
# FEET and HANDS (helm, body armour, pants, boots, gloves). The module picks one variant per spawn
# point (spawn id % variant count) and uses the same pick for that creature's drop, so the armour a
# corpse yields is the armour its spawn point shows. The other six outfit slots - shoulders, shirt,
# belt, bracers, cloak, tabard - stay per creature, so an entry keeps them across all its spawns.
# Candidate picks advance by one index per variant, so the variants differ as long as a slot's
# candidate list is at least this long.
armour_variants = 4

# Item level band: candidates sit in [creature_level, creature_level + item_level_window],
# where creature_level is creature_template.maxlevel.
item_level_window = 8

# Highest RequiredLevel a candidate may have: creature_level + required_level_margin.
required_level_margin = 3

# Highest item Quality a candidate may have (2 = uncommon).
quality_max = 2

# Lowest share of the selected creatures whose worn gear includes a bind-on-equip item: a creature
# counts when at least one of its three pool variants carries a bonding = 2 item among ItemID1..3,
# or one of its eleven outfit entries is BoE. Only those items may drop while
# CreatureGear.Drop.RequireBindOnEquip = 1 (the shipped default). Read by check_creature_gear.py,
# which falls back to 0.70 when the key is absent.
#
# The shipped dataset measures 72.29% (921 of 1274 creatures). The measure is set by the candidate
# rules, not by the BoE-first ordering the generator applies: with the whole 1-80 level range
# selected, bands whose quality <= 2 candidate pool holds no BoE item cap the ratio - ordering
# candidates bind-on-equip first moves it to only 72.37%, while quality_max is what moves it far
# (31.24% at 1, 87.68% at 3). The 0.89 this key carried while the dataset stopped at 400 entries
# was that slice's own ceiling and no longer describes the shipped data.
#
# 0.70 sits under the measured value and well above the 31.24% a rules change that strips BoE
# supply (quality_max = 1) produces, so the gate still fails on a collapse instead of pinning the
# current value at its exact measurement.
min_boe_coverage = 0.70
