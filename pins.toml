[core]
repo = "https://github.com/mod-playerbots/azerothcore-wotlk"
branch = "Playerbot"
commit = "8a4e76eac8c4ccebf547113afe7b51d6c3e91641"   # inspected 2026-10-16
# The guide clones branch HEAD with no pin; we pin both repos so a build is reproducible.

[module.playerbots]
repo = "https://github.com/mod-playerbots/mod-playerbots"
commit = "d750b4b3a50effdf22bedc8032f0e8e5f7cb8091"   # master, 2026-10-16
path = "modules/mod-playerbots"                        # DBUpdater loads module SQL from this path

[module.hardcore]
repo = "https://github.com/maluramichael/mod-hardcore"
commit = "e136b45af8097730a058090ec933b1d8849b7478"   # 2026-10-11
path = "modules/mod-hardcore"
license = "GPL-2.0-or-later"
# Vendored; see modules/mod-hardcore/UPSTREAM.md. Local changes: graveyard
# release is allowed for fallen ghosts, and bot-controlled sessions cannot opt
# in. Hardcore.DeathPolicy defaults to ghost.

[module.e_interact]
repo = "https://github.com/Rainblower/mod-e-interact"
commit = "0d17e70622085877929c68d583b18f3b0156c81c"   # initial release, 2026-10
path = "modules/mod-e-interact"
license = "MIT"
# Vendored; see modules/mod-e-interact/UPSTREAM.md. Local changes: a gameobject pass
# (chests, herb/ore nodes, questgiver objects) behind EInteract.Use.

[module.creature_gear]
repo = "https://github.com/nick-monto/acore-thor-selfhost"   # in-repo module, not a clone of its own
path = "modules/mod-creature-gear"                          # DBUpdater loads module SQL from this path
ref = "main"                                                # SELF_REF in thor-install.sh (overridable)
# The pin is this repository's own commit/tag: server-aarch64.yml copies modules/mod-creature-gear
# out of its checkout of this repo, and thor-install.sh --from-source fetches the same tree as a
# tarball from SELF_REPO ($SELF_REF, default main). No third-party hash to keep in step.

[module.mercenary]
repo = "https://github.com/nick-monto/acore-thor-selfhost"   # in-repo module, not a clone of its own
path = "modules/mod-mercenaries"                            # loader symbol Addmod_mercenariesScripts()
ref = "main"                                                # SELF_REF in thor-install.sh (overridable)
# The pin is this repository's own commit/tag: server-aarch64.yml copies modules/mod-mercenaries out of
# its checkout of this repo, and thor-install.sh --from-source fetches the same tree as a tarball
# from SELF_REPO ($SELF_REF, default main). The module ships no SQL: the picker is a pair of
# AllCreatureScript gossip hooks on every innkeeper, and its roster table is created in the
# characters database programmatically at startup. It needs mod-playerbots compiled in, because a
# mercenary is recruited through PlayerbotHolder::AddPlayerBot, and it reads the pool from the
# playerbots database, so it also needs the playerbots connection up.

[module.survivor]
repo = "https://github.com/nick-monto/acore-thor-selfhost"   # in-repo module, not a clone of its own
path = "modules/mod-survivor"                               # loader symbol Addmod_survivorScripts()
ref = "main"                                                # SELF_REF in thor-install.sh (overridable)
# The pin is this repository's own commit/tag: server-aarch64.yml copies modules/mod-survivor out of
# its checkout of this repo, and thor-install.sh --from-source fetches the same tree as a tarball
# from SELF_REPO ($SELF_REF, default main). The module ships one world SQL file (the container
# gameobject template) and creates its three character tables programmatically.

[module.runewords]
repo = "https://github.com/nick-monto/acore-thor-selfhost"   # in-repo module, not a clone of its own
path = "modules/mod-runewords"                              # loader symbol Addmod_runewordsScripts()
ref = "main"                                                # SELF_REF in thor-install.sh (overridable)
# The pin is this repository's own commit/tag: server-aarch64.yml copies modules/mod-runewords out of
# its checkout of this repo, and thor-install.sh --from-source fetches the same tree as a tarball
# from SELF_REPO ($SELF_REF, default main). The module ships no SQL of its own: its world half
# (the rune items, the runeword_words table and their drops) is generated into sql/custom/db_world
# by scripts/runewords/gen_runewords.py, and its one characters table (character_runeword_rune) is
# created programmatically at startup, the way mod-survivor's three are.

[data.client_data]
url = "https://github.com/wowgaming/client-data/releases/download/v20.0/data.zip"
size = 1196168257
sha256 = "a3d4df635ae6c2c8f08052c32a79e0f806955150ad36b014a823dd08a32a4610"
provides = ["dbc", "maps", "vmaps", "mmaps"]           # no WoW client needed for the server side

[artifact.win64]
workflow = ".github/workflows/server-win64.yml"
release_tag = "server-build-win64"                     # deliberately NOT marked latest
asset = "acore-server-win64.zip"
runner = "windows-2022"
toolchain = "MSVC (Visual Studio 2022, x64)"
prefix = "C:/acore"                                    # windows-install.ps1 -Root default
installer = "scripts/windows-install.ps1"
# Same core pin, same seven modules, same patches and same custom SQL as the arm64 artifact; the zip
# is flat (worldserver.exe and authserver.exe at the root, configs/, src/) because AzerothCore's
# Windows install has no prefix layout: ConfigMgr::GetConfigPath() returns "configs/" under
# AC_PLATFORM_WINDOWS (src/common/Configuration/Config.cpp:709) and it is CWD-relative.
# The tag is not marked latest on purpose: thor-install.sh resolves its artifact through
# releases/latest/download/acore-server-arm64.tar.zst, and there is only one latest per repository,
# so a second latest release would silently break every Thor install.

[artifact.win64.build_deps]
# Both are fetched by server-win64.yml and by scripts/windows-install.ps1, and both are checked
# against the sha256 here before anything is executed or linked: an installer or a .lib that a
# mirror controls is a poisoned artifact for everyone who runs the installer.

[artifact.win64.build_deps.boost]
version = "1.89.0"
url = "https://github.com/boostorg/boost/releases/download/boost-1.89.0/boost-1.89.0-b2-nodocs.zip"
sha256 = "5613e5fec10165940084ac85f3011bfffe56967231b08c29939c8b35817b005a"
digest = "GitHub's recorded digest for the release asset - the source archive, not a prebuilt installer"
use = "source tree; server-win64.yml builds filesystem, program_options, iostreams, regex and thread with b2, runtime-link=shared to match Boost_USE_STATIC_RUNTIME OFF"
were = "downloads.sourceforge.net boost-binaries 1.87.0 msvc-14.3 installer: a third-party mirror that publishes no checksum of any kind"

[artifact.win64.build_deps.mysql]
version = "8.4.9"
url = "https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip"
sha256 = "5795ba250e89290f7507ed3bcc6a655be373616abb58b877acdea71e1b8f4e8c"
md5_published = "fe14853279d1704e0f0eb253ea8c8d33"
sha256_source = "computed from a download whose md5 matched the sidecar Oracle publishes beside the zip"
use = "client library to build; server binaries to install"

# OpenSSL is not pinned: the windows-2022 runner image supplies it.

[artifact.x86_64]
workflow = ".github/workflows/server-x86_64.yml"
release_tag = "server-build-x86_64"                    # deliberately NOT marked latest
asset = "acore-server-x86_64.tar.zst"
runner = "ubuntu-24.04"
prefix = "/opt/acore"
# Same core pin, same seven modules, same patches and same custom SQL as the other two artifacts:
# server-aarch64.yml with the platform swapped, on a native x86_64 runner so the sonames match the
# arm64 artifact's generation. The tarball layout is the Docker image's (bin/ etc/ lib/ src/ under
# /opt/acore), which is also what thor-install.sh expects from a tarball. This tag is not marked
# latest for the same reason server-build-win64 is not: thor-install.sh resolves its artifact
# through releases/latest/download/acore-server-arm64.tar.zst, and there is only one latest per
# repository, so a second latest release would silently break every Thor install.

[database]
engine = "mysql-server 8.0.46 (Ubuntu noble arm64)"    # MySQL's own APT repo is amd64/i386 only
schemas = ["acore_auth", "acore_world", "acore_characters", "acore_playerbots"]
ports = { db = 3306, auth = 3724, world = 8085, soap = 7878 }   # SOAP disabled by default

[container]
image_base = "ubuntu:24.04"                            # headless: no display, no systemd, no compiler
compose = "docker/docker-compose.yml"
services = ["db", "acore"]                             # mysql:8.4 (healthcheck, no published port), the built image
volumes = ["db", "data", "logs", "state"]              # mysql data; client data; logs; first-boot marker
ports = [3724, 8085]                                   # auth, world; the database is compose-network only
bind = "127.0.0.1 (BIND_HOST defaults to loopback; windows-install.ps1 sets 0.0.0.0 only for -LanIp)"
payload = { amd64 = "acore-server-x86_64.tar.zst", arm64 = "acore-server-arm64.tar.zst", select = "TARGETARCH" }
conf_writer = "scripts/write-confs.sh"                 # wc_write_all: the same writer thor-install.sh calls
# A rebuild is a download, not a compile: the image unpacks the artifact at /opt/acore and checks
# bin/ etc/ lib/ src/, with ARTIFACT_URL/ARTIFACT_SHA256 overriding the asset (the .sha256 beside it
# is the default hash). Client data lives in the data volume - fetched and sha256-verified on first
# start, ~1.2 GiB - not in an image layer. The compose project name is fixed to acore-realm so the
# volumes keep their names wherever compose runs, which is what lets scripts/windows-install.ps1
# stage the four files in <root>\docker-src. `docker compose down -v` takes the whole realm with it.

[launcher]
repo = "https://github.com/wyattabuntjer/AYN-Thor-WoW-Launcher"
version = "2.6.0"
commit = "f02be3b"                                     # shallow clone 2026-10-16
# Target of the client-side change list in docs/LAUNCHER-HOSTING-DESIGN.md §3.

[launcher_components]
proton = { name = "proton-11.0-90624-arm64ec.wcp", sha256 = "137807f4145b1b440075f83b2b1b3501d19c4eb618784b1a28418652cae3db03" }
dxvk = { name = "dxvk-2.4.1-wow-aarch64-test.wcp", sha256 = "f660b5c6422b3f93cec65664f309718942e58581b5b96fa2902d55d63ce1db8a" }

[reference_guide]
repo = "https://github.com/DadsMmoLab/dads-mmo-lab"
path = "guides/wow-wotlk"
fetched = "2026-10-16"
