name: server-aarch64

# Builds the AzerothCore + mod-playerbots server for linux/arm64 and packages it together
# with the SQL sources, so the Thor never has to compile anything.
# The arm64 runner is native, so this is an ordinary-speed build of an aarch64 target.
#
# The tarball layout matches what scripts/thor-install.sh expects:
#     bin/    authserver, worldserver (+ tools), stripped
#     etc/    *.conf.dist and modules/*.conf.dist   (and the built-in _CONF_DIR is /opt/acore/etc)
#     src/    data/sql/, modules/mod-playerbots/data/sql/,
#             modules/mod-creature-gear/data/sql/, modules/mod-survivor/data/sql/,
#             modules/mod-pawn/data/sql/ and
#             data/sql/custom/db_world/ (the loot-bag patch) - the DB updater reads these
#             (mod-hardcore and mod-e-interact create nothing in the database and have no
#             SQL tree; mod-survivor ships one world file, the container gameobject
#             template, and creates its three character tables programmatically; mod-pawn
#             ships one world file, the obelisk template and spawns, and creates its roster
#             table programmatically)
#
# No data/ in the tarball. GitHub refuses release assets of 2 GiB or more, and the
# dbc/maps/vmaps/mmaps trees are around 1.2 GiB on their own, which is what pushed the first
# published asset over the limit. thor-install.sh fetches that data itself from the pinned
# upstream zip (DATA_URL/DATA_SHA256 in the installer) and verifies its sha256, so the same
# bytes reach the device without riding in the release.
#
# First run of this workflow is gate G1 in docs/SERVER-STACK.md section 9: it either produces
# the tarball or names the file that does not compile on aarch64.

on:
  workflow_dispatch:
  push:
    tags: ["server-v*"]

permissions:
  contents: write

env:
  CORE_REPO: https://github.com/mod-playerbots/azerothcore-wotlk.git
  CORE_COMMIT: 8a4e76eac8c4ccebf547113afe7b51d6c3e91641
  PB_REPO: https://github.com/mod-playerbots/mod-playerbots.git
  PB_COMMIT: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
  PREFIX: /opt/acore

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      # This repository is checked out for the modules under modules/; the core and
      # mod-playerbots are still fetched at their pinned commits below.
      - name: Checkout this repository (module source)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Disk space before the build
        run: df -h /

      - name: Dependencies
        run: |
          sudo apt-get update
          # This set is the upstream CI list (.github/workflows/core-build-playerbots.yml:51-55)
          # plus ninja, cross-checked against every find_package/find_library in deps/ and
          # src/cmake: Boost, BZip2, OpenSSL, ZLIB, Threads, Filesystem, MySQL, Readline.
          #
          # libbz2-dev, liblzma-dev, zlib1g-dev and libzstd-dev are not optional and not implied
          # by anything else. deps/bzip2 calls find_package(BZip2 REQUIRED) on UNIX, so
          # libbz2-dev is needed to configure at all. The other three are the -l flags that
          # cmake emits after libboost_iostreams.a, because the static Boost::iostreams
          # interface links bz2, lzma, z and zstd - and libboost-iostreams1.83-dev declares
          # only boost packages as dependencies, so libboost-all-dev never pulls them:
          #     Depends: libboost1.83-dev, libboost-regex1.83-dev, libboost-iostreams1.83.0
          # On x64 runner images those four happen to be preinstalled, which is why upstream CI
          # never noticed; ubuntu-24.04-arm does not carry liblzma-dev.
          # libicu-dev is for Boost::regex, which does declare it.
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build make gcc g++ clang lld patch \
            libboost-all-dev libssl-dev libbz2-dev liblzma-dev zlib1g-dev libzstd-dev \
            libicu-dev libreadline-dev libncurses-dev \
            libmysqlclient-dev unzip zstd patchelf

      # Cheap, deterministic and it guards the boot: a module SQL file that fails to apply aborts
      # the worldserver, so the pawn module's obelisk rows, roster schema and conf are checked
      # against each other before the 40-minute build rather than after it.
      - name: Check the pawn module's files agree
        run: python3 scripts/pawn/check_pawn.py

      - name: Fetch pinned sources
        run: |
          mkdir -p src && cd src
          git init -q core && cd core
          git remote add origin "$CORE_REPO"
          git fetch -q --depth 1 origin "$CORE_COMMIT"
          git checkout -q FETCH_HEAD
          cd ..
          git clone -q "$PB_REPO" playerbots
          cd playerbots && git fetch -q --depth 1 origin "$PB_COMMIT" && git checkout -q FETCH_HEAD && cd ..
          mkdir -p core/modules
          cp -a playerbots core/modules/mod-playerbots    # this path is load-bearing: module SQL, confs
          cp -a "$GITHUB_WORKSPACE/modules/mod-creature-gear" core/modules/mod-creature-gear
          cp -a "$GITHUB_WORKSPACE/modules/mod-hardcore" core/modules/mod-hardcore
          cp -a "$GITHUB_WORKSPACE/modules/mod-e-interact" core/modules/mod-e-interact
          cp -a "$GITHUB_WORKSPACE/modules/mod-survivor" core/modules/mod-survivor
          cp -a "$GITHUB_WORKSPACE/modules/mod-pawn" core/modules/mod-pawn
          # The player-centric distribution mode lives on top of the pinned module commit. The
          # patch is maintained here so the upstream pin stays exact; a bad patch fails the build.
          patch -p1 -d core/modules/mod-playerbots < "$GITHUB_WORKSPACE/patches/playerbots-player-centric.patch"
          grep -q "Playerbots.RandomBotNearPlayers" core/modules/mod-playerbots/conf/playerbots.conf.dist

      - name: Configure
        working-directory: src/core
        run: |
          # CONF_DIR follows CMAKE_INSTALL_PREFIX, and _CONF_DIR is compiled in: module
          # configs are always read from <prefix>/etc/modules, never from the -c path.
          #
          # No -DCMAKE_INSTALL_RPATH here: the core's CMakeLists sets it itself
          # (set(CMAKE_INSTALL_RPATH "${CMAKE_INSTALL_PREFIX}/lib"), lines 34-36), and a plain
          # set() shadows any -D value, so the installed binaries got the absolute
          # /opt/acore/lib instead. The "Bundle the libraries" step rewrites them to
          # $ORIGIN/../lib after install, which is what finds the bundled libraries wherever
          # the tarball is unpacked.
          #
          # -Wno-psabi is not a warning-level choice: GCC 10.1 fixed the C++17 ABI for
          # passing and returning classes with a zero-sized subobject - a homogeneous
          # aggregate such as std::pair<float, float> is now classified the way C++14
          # classifies it (gcc.gnu.org/gcc-10/changes.html, "Caveats") - and -Wpsabi, on by
          # default and untouched by WITH_WARNINGS, then notes every function that
          # passes or returns one. On aarch64 that is every std::pair<float, float> in
          # mod-playerbots' dungeon AI and in the console's headers, so the log fills with
          # "parameter passing for argument of type 'std::pair<float, float>' when C++17 is
          # enabled changed to match C++14 in GCC 10.1". The note is about mixing objects
          # built by GCC <= 10.0 in C++17 mode with objects built by GCC >= 10.1, and this
          # build cannot mix anything: one GCC 13 toolchain, C++20, core and modules in a
          # single project, Boost from the same image. Silencing it hides no real risk here
          # and keeps the notes that do matter visible.
          cmake -S . -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DAPPS_BUILD=all -DTOOLS_BUILD=all \
            -DSCRIPTS=static -DMODULES=static \
            -DBoost_USE_STATIC_LIBS=ON \
            -DWITH_WARNINGS=OFF \
            -DCMAKE_CXX_FLAGS="-Wno-psabi"
          # Prove it reached the compiler rather than only the cache: a target that resets
          # CMAKE_CXX_FLAGS would take the flag with it, and the notes would come back silently.
          grep -q -- '-Wno-psabi' build/build.ninja || {
            echo "::error::-Wno-psabi is not in the build's compile lines"; exit 1; }

      - name: Build
        working-directory: src/core
        # -k 0 keeps ninja going after a failure: every target that does not link is named in
        # one run instead of one run per missing package.
        run: cmake --build build --parallel "$(nproc)" -- -k 0

      - name: Install
        working-directory: src/core
        run: |
          # RelWithDebInfo embeds DWARF, and the release asset has a 2 GiB ceiling: strip on
          # install, then check the section is gone rather than assume the flag took effect.
          sudo cmake --install build --strip
          sudo rm -rf build                      # free the space before the big copies
          if readelf -S "$PREFIX/bin/worldserver" | grep -q '\.debug_info'; then
            echo "::error::worldserver still carries .debug_info; the install did not strip"
            exit 1
          fi
          ls -l "$PREFIX/bin"
          du -sh "$PREFIX/bin" "$PREFIX/etc"
          # Prove the module was discovered, not merely copied: CMake installs
          # every module's conf/*.conf.dist into <prefix>/etc/modules.
          test -f "$PREFIX/etc/modules/mod_hardcore.conf.dist"
          grep -q '^Hardcore.DeathPolicy = ghost$' "$PREFIX/etc/modules/mod_hardcore.conf.dist"
          # Same proof for the interact module: the conf is installed, and it carries the local
          # gameobject option, so a build that silently dropped the vendored pass fails here.
          test -f "$PREFIX/etc/modules/mod_e_interact.conf.dist"
          grep -q '^EInteract.Use = 1$' "$PREFIX/etc/modules/mod_e_interact.conf.dist"
          # And for the survivor module: the conf is installed and its master switch is at the
          # shipped value, so a build that dropped the module is caught here rather than in game.
          test -f "$PREFIX/etc/modules/mod-survivor.conf.dist"
          grep -q '^Survivor.Enable = 1$' "$PREFIX/etc/modules/mod-survivor.conf.dist"
          # And for the pawn module: its conf is installed and carries both a switch and an
          # archetype blacklist, so a build that dropped the module or its conf fails here.
          test -f "$PREFIX/etc/modules/mod-pawn.conf.dist"
          grep -q '^Pawn.Enable = 1$' "$PREFIX/etc/modules/mod-pawn.conf.dist"
          grep -q '^Pawn.Blacklist.1.2 = ' "$PREFIX/etc/modules/mod-pawn.conf.dist"

      - name: Bundle the libraries whose soname is tied to this release
        run: |
          # The binaries link a MySQL client library and ICU, and neither is in the install tree.
          # Both are release-coupled: ubuntu-24.04, which this builds on, has MySQL 8.0's
          # libmysqlclient.so.21 and ICU 74, while 25.04 and 25.10 have MySQL 8.4's
          # libmysqlclient.so.24 and ICU 76 - same libraries, different sonames - so a rootfs from
          # one of those cannot load this binary at all, whatever apt installs there. The libraries
          # therefore travel beside the binaries and the $ORIGIN/../lib rpath finds them.
          # thor-install.sh carries the device-side soname-to-package map (packages_for_soname,
          # reference_deb_for_soname) for anything this bundle does not cover.
          #
          # Which files to copy is read off the built binaries with ldd, and their DT_NEEDED entries
          # are printed first so the log says what the build actually linked. The step this replaced
          # named the sonames instead and copied them with cp -av "/usr/lib/aarch64-linux-gnu/$pattern",
          # where $pattern held the '*': quoting suppresses the expansion, so cp was handed a literal
          # path ending in an asterisk and failed - that asterisk is visible in the message,
          # "cannot stat '/usr/lib/aarch64-linux-gnu/libmysqlclient.so.21*': No such file or
          # directory", which is the tell. Run 39191578317 was the first ever to reach this step, so
          # nothing had exercised that line. Reading the names off the binaries is what makes the
          # copy independent of both the release and that mistake.
          # The family names are the contract; the soname inside a family is not.
          #
          # Nothing from glibc, libstdc++ or OpenSSL is copied: their sonames are stable across the
          # releases this targets, and pinning glibc would break a newer rootfs instead.

          sudo mkdir -p "$PREFIX/lib"
          # bin/ holds mmaps-config.yaml beside the executables, and patchelf - like readelf -
          # only means anything for an ELF file: run 39285821353 failed here with no annotation at
          # all, because patchelf refused the YAML and set -e took the step down. Select by magic.
          binaries=()
          for f in "$PREFIX/bin/"*; do
            if [ "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ]; then
              binaries+=("$f")
            else
              echo "not an ELF file, leaving it alone: $(basename "$f")"
            fi
          done
          [ "${#binaries[@]}" -gt 0 ] || { echo "::error::no ELF files under $PREFIX/bin"; exit 1; }

          # The core's CMake installs the binaries with the absolute $PREFIX/lib on their rpath
          # (CMakeLists.txt:34-36) and shadows the -D value from configure, so rewrite it here:
          # $ORIGIN/../lib is what makes the bundled libraries findable in a rootfs that unpacked
          # the server anywhere other than /opt/acore.
          for bin in "${binaries[@]}"; do
            sudo patchelf --set-rpath '$ORIGIN/../lib' "$bin"
          done
          echo "--- rpath on the installed binaries ---"
          readelf -d "$PREFIX/bin/worldserver" | grep -E 'RPATH|RUNPATH' || true

          echo "--- what the binaries recorded at link time ---"
          readelf -d "${binaries[@]}" | grep -E 'NEEDED.*(mysql|mariadb|icu)' || true
          echo "--- and what the loader makes of that here ---"
          ldd "${binaries[@]}" 2>/dev/null | grep -E 'mysql|mariadb|icu' || true

          # Every soname of interest, as the loader names it: a path when it can resolve one, the
          # bare soname when it cannot.
          sonames=$(ldd "${binaries[@]}" 2>/dev/null \
                    | awk '/=>/ {print ($3 == "not" ? $1 : $3)} !/=>/ {print $1}' \
                    | sed -e 's#^.*/##' | sort -u \
                    | grep -E '^(libmysqlclient|libmariadb|libicuuc|libicui18n|libicudata)\.so\.' || true)
          echo "--- coupled sonames ---"
          echo "$sonames"

          while read -r soname; do
            [ -n "$soname" ] || continue
            # Both directories are searched, and only those: the link resolved the soname a moment
            # ago, so it is in the loader's path here. No ldconfig call, which is one less thing
            # this can depend on in an environment where nobody can see stderr.
            path=$(find /lib/aarch64-linux-gnu /usr/lib/aarch64-linux-gnu -maxdepth 1 -name "$soname" -print -quit 2>/dev/null)
            if [ -z "$path" ]; then
              # The link succeeded, so this image had the file a moment ago; a soname that is now
              # unresolvable is worth failing on rather than shipping a bundle with a hole in it.
              echo "::error::$soname is linked but this image no longer has a file for it"
              dpkg -l | grep -E 'lib(mysqlclient|mariadb|icu)' || true
              find /usr/lib /lib -maxdepth 3 \( -name 'libmysqlclient*' -o -name 'libmariadb*' \) 2>/dev/null | head -20 || true
              exit 1
            fi
            # -L, because what the loader looks up is the soname: ship a real file under that name
            # rather than the symlink chain the development package leaves behind.
            sudo cp -Lv "$path" "$PREFIX/lib/$soname"
          done <<< "$sonames"

          sudo du -sh "$PREFIX/lib"
          ls -l "$PREFIX/lib"

          # One family has to be in the bundle, and it is the one the link actually pulls in: the
          # MySQL client. ICU appears in no binary - Boost is static here and the build references
          # no ICU symbol, so ldd reports none of it, whatever the comment this step replaced
          # claimed about ICU 74. That is the reason the accounting is left to the check below
          # instead of a list of families written down here: run 39269283834 failed on a list that
          # demanded libicuuc and the link had none, and a guard that fires on a wrong premise is
          # only useful if its premise is corrected. The ldd filter above still collects ICU by
          # name, so a build that begins to link it ships it.
          if ! ls "$PREFIX/lib" | grep -qE '^(libmysqlclient|libmariadb)\.so\.'; then
            echo "::error::no MySQL client library in $PREFIX/lib, though the link resolved one"
            exit 1
          fi

          # A silent loss of the rpath would leave the Thor needing exactly the library that is
          # now bundled, so check the installed binary rather than the flag.
          if ! readelf -d "$PREFIX/bin/worldserver" | grep -q 'ORIGIN/../lib'; then
            echo "::error::worldserver has no \$ORIGIN/../lib rpath; the bundled libraries would not be found"
            exit 1
          fi

          # The Thor's situation, checked rather than assumed: with this image's own copies moved
          # aside, everything the binaries need has to resolve out of $PREFIX/lib through that
          # rpath. Put them back whichever way the check goes.
          hidden=$(mktemp -d)
          # One file at a time: with the three patterns on a single mv, a pattern that matches
          # nothing (this image has no libmariadb) makes mv fail as a whole, so nothing would be
          # moved and the check would pass without testing anything.
          moved=0
          for f in /usr/lib/aarch64-linux-gnu/libmysqlclient*.so.* \
                   /usr/lib/aarch64-linux-gnu/libmariadb*.so.* \
                   /usr/lib/aarch64-linux-gnu/libicu*.so.*; do
            [ -e "$f" ] || continue
            if sudo mv "$f" "$hidden/"; then moved=$((moved + 1)); fi
          done
          echo "moved aside: $moved file(s)"
          [ "$moved" -gt 0 ] ||
            echo "::warning::this image had nothing to move aside, so the check below proves nothing"
          missing=$(ldd "$PREFIX/bin/worldserver" 2>/dev/null | awk '/not found/ {print $1}' | sort -u)
          sudo mv "$hidden"/*.so.* /usr/lib/aarch64-linux-gnu/ 2>/dev/null || true
          if [ -n "$missing" ]; then
            echo "::error::the bundle is not self-sufficient; the Thor would fail to load these"
            # One annotation per library: an annotation carries one line, and that list is where
            # a fix has to start.
            while read -r lib; do echo "::error::missing from the bundle: $lib"; done <<< "$missing"
            ldd "$PREFIX/bin/worldserver" | head -30
            exit 1
          fi
          echo "the bundle is self-sufficient: every coupled library resolves through \$ORIGIN/../lib"

      - name: SQL sources (what the DB updater reads on first boot)
        run: |
          # cp -a does not create the parents of its destination, and the trailing-slash form used
          # here before failed with "cannot create directory ... No such file or directory" the
          # first time this step actually ran, because $PREFIX/src/data did not exist yet. Name
          # the destinations outright and create what they need.
          sudo mkdir -p "$PREFIX/src/data" \
                        "$PREFIX/src/modules/mod-playerbots/data" \
                        "$PREFIX/src/modules/mod-creature-gear/data" \
                        "$PREFIX/src/modules/mod-survivor/data" \
                        "$PREFIX/src/modules/mod-pawn/data"
          sudo cp -a src/core/data/sql "$PREFIX/src/data/sql"
          sudo cp -a src/playerbots/data/sql "$PREFIX/src/modules/mod-playerbots/data/sql"
          sudo cp -a src/core/modules/mod-creature-gear/data/sql "$PREFIX/src/modules/mod-creature-gear/data/sql"
          sudo cp -a src/core/modules/mod-survivor/data/sql "$PREFIX/src/modules/mod-survivor/data/sql"
          sudo cp -a src/core/modules/mod-pawn/data/sql "$PREFIX/src/modules/mod-pawn/data/sql"
          # The CUSTOM slot is already registered in the base database
          # (data/sql/base/db_world/updates_include.sql), so these files ride in
          # under the core's own data/sql/custom/db_world directory.
          sudo mkdir -p "$PREFIX/src/data/sql/custom/db_world"
          sudo cp -a "$GITHUB_WORKSPACE/sql/custom/db_world/." "$PREFIX/src/data/sql/custom/db_world/"

          # check the layout instead of trusting the copies: one level wrong here and the DB
          # updater finds nothing to apply.
          for d in data/sql modules/mod-playerbots/data/sql modules/mod-creature-gear/data/sql modules/mod-survivor/data/sql modules/mod-pawn/data/sql data/sql/custom/db_world; do
            n=$(find "$PREFIX/src/$d" -name '*.sql' | wc -l)
            echo "$d: $n .sql files"
            if [ "$n" -eq 0 ]; then
              echo "::error::$PREFIX/src/$d has no .sql files"
              exit 1
            fi
          done
          sudo du -sh "$PREFIX/src"

      - name: Package
        run: |
          # zstd -19 costs a minute on a payload this size and saves the Thor the difference.
          sudo tar --use-compress-program="zstd -19 -T0" -cf acore-server-arm64.tar.zst \
            -C "$PREFIX" bin etc lib src
          sudo chown "$USER" acore-server-arm64.tar.zst
          ls -lh acore-server-arm64.tar.zst
          size=$(stat -c %s acore-server-arm64.tar.zst)
          echo "asset size: $size bytes ($(numfmt --to=iec "$size"))"
          # 2147483648 is GitHub's ceiling for a single release asset: "size must be less than
          # 2147483648". Fail here, in seconds, instead of after the upload is refused.
          if [ "$size" -ge 2147483648 ]; then
            echo "::error::acore-server-arm64.tar.zst is $size bytes, at or over GitHub's 2 GiB release-asset limit"
            exit 1
          fi
          sha256sum acore-server-arm64.tar.zst > acore-server-arm64.tar.zst.sha256
          cat acore-server-arm64.tar.zst.sha256
          df -h /

      # v4 targets Node 20, which the runners force onto Node 24 and then warn about.
      # v5 still runs on Node 20 by default; v6 and v7 are the node24 majors. v7 wants a runner
      # of at least 2.327.1, which only concerns self-hosted runners. name/path/retention-days
      # are unchanged; v7's new inputs (archive, overwrite) are opt-in.
      - uses: actions/upload-artifact@v7
        with:
          name: acore-server-arm64
          path: |
            acore-server-arm64.tar.zst
            acore-server-arm64.tar.zst.sha256
          retention-days: 14

      # scripts/thor-install.sh downloads
      #   https://github.com/<owner>/<repo>/releases/latest/download/acore-server-arm64.tar.zst
      # so *some* release has to carry the asset after every successful build, not only after a
      # tag. Manual runs therefore refresh a rolling "server-build" release marked as latest.
      #
      # Every gh call passes -R "$GITHUB_REPOSITORY". gh otherwise derives the repository from a
      # git remote in the working directory, and several unrelated ones are there now: the
      # checkout of this repository at the workspace root and the core/playerbots clones under
      # src/. -R removes the guess, and the token is the GH_TOKEN below rather than a stored
      # credential, which is why the checkout runs with persist-credentials: false. No step
      # pushes with git: the two cores are fetched over anonymous https.
      - name: Publish the rolling release (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/server-v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are rewritten on every run, not just when the release is created. They were
          # only passed to "gh release create" before, so after the first ever run the page kept
          # describing whichever build created it - by 2026-10-26 it still named a core/playerbots
          # pair from 2026-10-17 and no module list, while the asset beside it was three builds
          # newer. The body is the only place a device can be matched to a build, so it names this
          # repository's commit and the run that produced the asset.
          #
          # The upload comes before the edit: the notes must not claim a build whose asset failed
          # to upload. On the very first run "create" needs notes to make the release at all, so
          # the same text is built once and handed to both.
          notes="$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Rolling build: AzerothCore core $CORE_COMMIT + mod-playerbots $PB_COMMIT, this repository at ${GITHUB_SHA:0:7} (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), linux/arm64, with client data v20.0 and the SQL sources." \
            "Artifact sha256: $(awk '{print $1}' acore-server-arm64.tar.zst.sha256). Compare it with ARTIFACT_SHA in \$ROOT/.thor-state/state.env on the device to tell which build is installed." \
            "Modules: mod-creature-gear, mod-hardcore (ghost default), mod-e-interact (one interact key, with the local gameobject pass), mod-survivor (death drops the gear into a lootable container) and mod-pawn (recruit two named pawns at a town obelisk; they level with you inside a two-level window and never compete for loot), plus the loot-bag patch and the player-centric bot patch." \
            "Install with scripts/thor-install.sh. A server that is already installed is left alone unless --force is passed: the installer skips the artifact whenever \$ROOT/bin/worldserver exists, so a newer build does not reach the device by re-running the script.")"
          gh release view server-build -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create server-build -R "$GITHUB_REPOSITORY" --latest \
              --title "Latest arm64 server build" \
              --notes "$notes"
          gh release upload server-build -R "$GITHUB_REPOSITORY" \
            acore-server-arm64.tar.zst acore-server-arm64.tar.zst.sha256 --clobber
          gh release edit server-build -R "$GITHUB_REPOSITORY" --notes "$notes"

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/server-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --title "Server build $GITHUB_REF_NAME" \
